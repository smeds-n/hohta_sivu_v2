<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Hohta social sharing image</title>
  <style>
    @font-face { font-family: Inter; src: url('../assets/inter-variable.woff2'); font-weight: 100 900; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; display: grid; grid-template-columns: 54% 46%; font-family: Inter, sans-serif; color: #0a0a0a; background: #fff; }
    .visual { background: url('../mockup-1280.webp') center center / cover; }
    .copy { display: flex; flex-direction: column; align-items: flex-start; padding: 58px 48px; border-left: 1px solid #e5e5e5; }
    .logo { font-size: 48px; font-weight: 700; letter-spacing: 0.05em; }
    h1 { font-size: 54px; line-height: 1.06; letter-spacing: -0.03em; font-weight: 750; margin: auto 0 22px; }
    p { font-size: 22px; line-height: 1.4; color: #525252; margin: 0 0 auto; }
    .domain { font-size: 18px; letter-spacing: 0.03em; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="visual"></div>
  <div class="copy">
    <span class="logo">HOHTA</span>
    <h1>Aurinkotuotanto näkyville.</h1>
    <p lang="en">Make solar production visible.</p>
    <span class="domain">hohta.fi</span>
  </div>
</body>
</html>
