<header class="site-header">
  <a href="index.html" class="logo-link"><span class="logo">HOHTA</span></a>
  <a href="../contact.html" class="language-link" lang="fi" aria-label="Finnish version">🇫🇮 FI</a>
</header>

<main class="content-paper">
  <section class="contact-section">
    <div class="section-content">
      <h1>Contact us</h1>
      <p>Interested in the pilot program? Fill out the form and we will get in touch.</p>

      <form class="contact-form" action="https://submit-form.com/gGmWwBq7v" method="POST">
        <input type="hidden" name="_redirect" value="https://hohta.fi/en/thank-you.html">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="company">Company</label>
          <input type="text" id="company" name="company" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone">
        </div>

        <div class="form-group">
          <label for="solar">Do you already have a solar power plant in use?</label>
          <select id="solar" name="solar">
            <option value="">Select...</option>
            <option value="yes">Yes</option>
            <option value="planned">Planned</option>
            <option value="no">Not yet</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message (optional)</label>
          <textarea id="message" name="message" rows="4"></textarea>
        </div>

        <button type="submit" class="primary">Send →</button>
      </form>
    </div>
  </section>
</main>
