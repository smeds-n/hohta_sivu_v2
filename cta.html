<body>

<header class="site-header">
  <a href="index.html" class="logo-link"><span class="logo">HOHTA</span></a>
</header>

<main class="content-paper">
  <section class="contact-section">
    <div class="section-content">
      <h1>Kylla haluan!</h1>
      <p>Jätä yhteystietosi, niin otamme sinuun yhteyttä.</p>

      <form class="contact-form" action="https://submit-form.com/gGmWwBq7v" method="POST">
        <input type="hidden" name="_redirect" value="https://hohta.fi/kiitos.html">
        <input type="hidden" name="source" value="Hero CTA">

        <div class="form-group">
          <label for="name">Nimi</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="company">Yritys</label>
          <input type="text" id="company" name="company" required>
        </div>

        <div class="form-group">
          <label for="email">Sähköposti</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Puhelinnumero</label>
          <input type="tel" id="phone" name="phone">
        </div>

        <div class="form-group">
          <label for="message">Viesti (valinnainen)</label>
          <textarea id="message" name="message" rows="4"></textarea>
        </div>

        <button type="submit" class="primary">Lähetä →</button>
      </form>
    </div>
  </section>
</main>
